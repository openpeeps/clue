# TEMP-VERIFY: proves the fresh-DB SIGSEGV fix on Windows before release.
# Bootstrapping a fixed clue with the broken released clue is a dead end
# (the old binary ignores clue.lock and crashes on full resolution), so this
# compiles a minimal datpkgr harness from source instead: no clue binary,
# no registry packages beyond git access. It drives installPackage over a
# fresh root with real fetch waves + version-cache writes + install pool —
# the exact crash window from `clue install` on an empty ~/.clue.
# DELETE THIS FILE once it is green.
name: verify-windows-fresh
on:
  workflow_dispatch:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: nimbase/setup-nim-action@main
        with:
          nim-version: stable

      - name: Check out datpkgr fix branch
        uses: actions/checkout@v4
        with:
          repository: openpeeps/datpkgr
          ref: fix-fresh-db-segv
          path: datpkgr

      - name: Clone dependency sources (nimble pkgs2 layout)
        run: |
          set -eu
          mkdir -p nimble_pkgs
          add() {
            local name="$1" url="$2"
            echo ">> cloning ${name}"
            git clone --depth 1 "${url}" "nimble_pkgs/${name}"
            local sha nimble ver
            sha="$(git -C "nimble_pkgs/${name}" rev-parse HEAD)"
            nimble="$(find "nimble_pkgs/${name}" -maxdepth 1 -name '*.nimble' | head -n 1)"
            [[ -n "${nimble}" ]] || { echo "ERROR: no .nimble in ${name}"; exit 1; }
            ver="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${nimble}" | head -n 1)"
            [[ -n "${ver}" ]] || ver="0.0.0"
            mv "nimble_pkgs/${name}" "nimble_pkgs/${name}-${ver}-${sha}"
            echo ">> ${name} -> ${name}-${ver}-${sha}"
          }
          add boogie https://github.com/openpeeps/boogie
          add openparser https://github.com/openpeeps/openparser
          add semver https://github.com/euantorano/semver.nim
          add threading https://github.com/nim-lang/threading
          add flysystem https://github.com/openpeeps/flysystem
          add mimedb https://github.com/openpeeps/mimedb
          add checksums https://github.com/nim-lang/checksums
          add sorta https://github.com/narimiran/sorta
          add vancode https://github.com/openpeeps/vancode
          add voodoo https://github.com/openpeeps/voodoo
          add db_connector https://github.com/nim-lang/db_connector

      - name: Build verify harness from source
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          flags="--path:datpkgr/src"
          for p in boogie openparser semver threading flysystem mimedb checksums sorta vancode voodoo db_connector; do
            match="$(echo nimble_pkgs/"$p"-*/)"
            [[ -d "${match}" ]] || { echo "ERROR: no package dir for $p"; exit 1; }
            flags="${flags} --path:${match%/}"
          done
          echo ">> ${flags}"
          nim c -d:release --stacktrace:on --linetrace:on --threads:on --mm:arc --hints:off \
            ${flags} \
            -o:verify.exe datpkgr/verify_fresh_db.nim
          ls -la verify.exe

      - name: Fresh-DB verify (x2)
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          for i in 1 2; do
            echo ">> round $i: fresh root"
            rm -rf verify_root
            ./verify.exe verify_root
          done
          echo ">> fresh-DB verification passed"
