# TEMP-VERIFY: proves the fresh-DB SIGSEGV fix on Windows before release.
# Bootstrapping a fixed clue with the broken released clue is a dead end
# (the old binary ignores clue.lock and crashes on full resolution), so this
# compiles a minimal datpkgr harness from source instead: no clue binary,
# no registry packages beyond git access. It drives installPackage over a
# fresh root with real fetch waves + version-cache writes + install pool —
# the exact crash window from `clue install` on an empty ~/.clue.
# DELETE THIS FILE once it is green.
name: verify-windows-fresh
on:
  workflow_dispatch:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: nimbase/setup-nim-action@main
        with:
          nim-version: stable

      - name: Check out datpkgr fix branch
        uses: actions/checkout@v4
        with:
          repository: openpeeps/datpkgr
          ref: fix-fresh-db-segv
          path: datpkgr

      - name: Clone dependency sources
        run: |
          set -eu
          mkdir -p deps
          cd deps
          clone() { echo ">> cloning $1"; git clone --depth 1 "$1" "$2"; }
          clone https://github.com/openpeeps/boogie boogie
          clone https://github.com/openpeeps/openparser openparser
          clone https://github.com/euantorano/semver.nim semver
          clone https://github.com/nim-lang/threading threading
          clone https://github.com/openpeeps/flysystem flysystem
          clone https://github.com/openpeeps/mimedb mimedb
          clone https://github.com/nim-lang/checksums checksums
          clone https://github.com/narimiran/sorta sorta
          clone https://github.com/openpeeps/vancode vancode
          clone https://github.com/openpeeps/voodoo voodoo
          clone https://github.com/nim-lang/db_connector db_connector

      - name: Build verify harness from source
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          nim c -d:release --stacktrace:on --linetrace:on --threads:on --mm:arc --hints:off \
            --path:datpkgr/src \
            --path:deps/boogie/src \
            --path:deps/openparser/src \
            --path:deps/semver \
            --path:deps/threading \
            --path:deps/flysystem \
            --path:deps/mimedb \
            --path:deps/checksums \
            --path:deps/sorta \
            --path:deps/vancode \
            --path:deps/voodoo \
            --path:deps/db_connector \
            -o:verify.exe datpkgr/verify_fresh_db.nim
          ls -la verify.exe

      - name: Fresh-DB verify (x2)
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          for i in 1 2; do
            echo ">> round $i: fresh root"
            rm -rf verify_root
            ./verify.exe verify_root
          done
          echo ">> fresh-DB verification passed"
