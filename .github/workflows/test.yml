name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      cache: false
      os: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-14"},{"os":"macos-15-intel"}]'
      nim-version: stable
      test-flags: "-d:release"
      pre-test-command: |
        clue build -d:release --verbose
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # Git for Windows bundles rsync/touch/ssh in usr/bin, but that
          # dir is not on PATH for cmd-spawned processes (which is how
          # Nim's execCmdEx launches tools). Expose it to later steps.
          git_bin="$(dirname "$(command -v git)")"
          echo "$(cygpath -w "${git_bin}/../usr/bin")" >> "$GITHUB_PATH"
        fi