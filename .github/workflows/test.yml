name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      cache: false
      os: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-14"},{"os":"macos-15-intel"}]'
      nim-version: stable
      test-flags: "-d:release"
      pre-test-command: |
        clue build -d:release --verbose
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # Windows has no built-in rsync, so install it via Chocolatey.
          # cwRsync lands on system PATH and is visible to cmd-spawned
          # processes (which is how Nim execCmdEx launches tools).
          choco install -y rsync
          # Fallback: Git for Windows ssh/touch in usr/bin. Probe the
          # canonical location first, then the git-relative one, since
          # command -v git can resolve to mingw64/bin on some runners.
          for cand in "/c/Program Files/Git/usr/bin" "$(dirname "$(command -v git)")/../usr/bin"; do
            if [[ -x "$cand/rsync.exe" ]]; then
              echo "$(cygpath -w "$cand")" >> "$GITHUB_PATH"
              break
            fi
          done
          export PATH="$PATH:/c/Program Files/Git/usr/bin"
          which rsync || where rsync
          rsync --version
          cmd.exe /c "rsync --version"
        fi