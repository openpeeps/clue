name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      os: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-14"},{"os":"macos-15-intel"}]'
      pre-install-command: |
        git clone --depth 1 https://github.com/openpeeps/datpkgr datpkgr
        cd datpkgr && clue develop && cd ..
      pre-test-command: |
        clue build -d:release